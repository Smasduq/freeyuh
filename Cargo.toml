[package]
name = "freeyuh"
version = "0.1.0"
edition = "2024"

[dependencies]
async-lock = "3.4.2"
chrono = "0.4.45"
glib = "0.22.9"
gtk4 = "0.11.4"
gtk4-layer-shell = "0.8.1"
serde = "1.0.229"
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
zbus = { version = "5.19.0", features = ["tokio"] }
